name: Docker

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build development target
        run: docker build --target development -t gin-learn:dev .

      - name: Build production target
        run: docker build --target production -t gin-learn:prod .

  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Boot prod stack
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

      - name: Wait for healthy API
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/health; then exit 0; fi
            sleep 5
          done
          echo "API never became healthy"
          docker compose -f docker-compose.yml -f docker-compose.prod.yml logs api | tail -20
          exit 1

      - name: Register smoke test
        run: |
          curl -fs -X POST http://localhost:8080/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI Smoke","email":"ci@example.com","password":"supersecret123","age":30}'

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml down -v
