name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: adminpassword
          POSTGRES_DB: gin_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d gin_app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://admin:adminpassword@localhost:5432/gin_app_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: gofmt check
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          $(go env GOPATH)/bin/golangci-lint run ./...

      - name: tests
        run: make test
